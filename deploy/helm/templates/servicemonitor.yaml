{{/* ServiceMonitor：让 Prometheus 自动发现 /metrics 端点
   依赖 prometheus-operator CRD，无 CRD 时可禁用。
*/}}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ariadne.fullname" (dict "Release" .Release "componentName" "api") }}
  labels:
    {{- include "ariadne.labels" (dict "Chart" .Chart "Release" .Release "componentName" "api") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ariadne.selectorLabels" (dict "Release" .Release "componentName" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
