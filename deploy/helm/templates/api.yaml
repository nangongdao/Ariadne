{{/* API Deployment + Service + HPA */}}
{{- if .Values.api.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ariadne.fullname" (dict "Release" .Release "componentName" "api") }}
  labels:
    {{- include "ariadne.labels" (dict "Chart" .Chart "Release" .Release "componentName" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "ariadne.selectorLabels" (dict "Release" .Release "componentName" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ariadne.selectorLabels" (dict "Release" .Release "componentName" "api") | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "ariadne.image" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # console script（见 pyproject [project.scripts]）。原先的
          # `python -m ariadne.cli api` 只导入模块就退出 0 —— cli.py 没有
          # __main__ 块，run_api() 从未被调用。
          command: ["ariadne-api"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "ariadne.storageEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ariadne.fullname" (dict "Release" .Release "componentName" "api") }}
  labels:
    {{- include "ariadne.labels" (dict "Chart" .Chart "Release" .Release "componentName" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ariadne.selectorLabels" (dict "Release" .Release "componentName" "api") | nindent 4 }}
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ariadne.fullname" (dict "Release" .Release "componentName" "api") }}
  labels:
    {{- include "ariadne.labels" (dict "Chart" .Chart "Release" .Release "componentName" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ariadne.fullname" (dict "Release" .Release "componentName" "api") }}
  minReplicas: {{ .Values.api.hpa.minReplicas | default .Values.api.replicaCount }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
